<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">Productivity Tool</p>
        <h1>Prompt Library</h1>
        <p class="subtitle">
          Save reusable prompts, keep them organized, and remove what you no longer need.
        </p>
      </header>

      <section class="panel form-panel" aria-labelledby="new-prompt-title">
        <h2 id="new-prompt-title">New Prompt</h2>
        <form id="prompt-form" novalidate>
          <div class="field-group">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" maxlength="80" placeholder="Ex: Blog post outline" required />
          </div>

          <div class="field-group">
            <label for="content">Prompt Content</label>
            <textarea
              id="content"
              name="content"
              rows="6"
              maxlength="2000"
              placeholder="Write your prompt here..."
              required
            ></textarea>
          </div>

          <div class="actions">
            <button type="submit" class="btn btn-primary">Save Prompt</button>
            <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
          </div>
        </form>
      </section>

      <section class="panel list-panel" aria-labelledby="saved-prompts-title">
        <div class="list-header">
          <h2 id="saved-prompts-title">Saved Prompts</h2>
          <span id="prompt-count" class="count-badge">0</span>
        </div>

        <ul id="prompt-list" class="prompt-list" aria-live="polite"></ul>

        <div id="empty-state" class="empty-state">
          <p>No prompts saved yet. Add your first prompt above.</p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
