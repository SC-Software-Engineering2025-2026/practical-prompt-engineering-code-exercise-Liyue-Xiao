<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <main class="app">
    <header class="app-header">
      <h1>Prompt Library</h1>
      <p>Save reusable prompts for faster workflows.</p>
    </header>

    <section class="panel form-panel" aria-label="Create prompt">
      <form id="prompt-form">
        <label for="prompt-title">Prompt Title</label>
        <input
          id="prompt-title"
          name="title"
          type="text"
          placeholder="Example: Product launch email"
          required
        />

        <label for="prompt-content">Prompt Content</label>
        <textarea
          id="prompt-content"
          name="content"
          placeholder="Write your full prompt here..."
          rows="6"
          required
        ></textarea>

        <button type="submit">Save Prompt</button>
      </form>
    </section>

    <section class="panel list-panel" aria-label="Saved prompts">
      <div class="panel-title-row">
        <h2>Saved Prompts</h2>
      </div>
      <div id="prompt-list" class="prompt-list"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
